name: Y7 Sport automatic football feed
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
concurrency:
  group: y7-sport-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch schedules and LiveTV fixture links
        run: python scripts/update_y7_sport_feed.py
      - name: Commit refreshed feed if changed
        run: |
          git config user.name "Y7 Sport Update"
          git config user.email "actions@users.noreply.github.com"
          git add y7_sport_feed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(sport): refresh public football fixtures"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
